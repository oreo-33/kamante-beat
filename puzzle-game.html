<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>かまんてパズル</title>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Antique+Soft&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        html,body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Klee One',sans-serif;
            color: #fff;
            background: linear-gradient(180deg,#070b24,#151a55 55%,#3a1d5c);
        }
        #app {
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        #ui {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: calc(env(safe-area-inset-top,0px) + 6px) 8px 6px;
            background: rgba(0,0,0,.55);
        }
        #st {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.3;
        }
        #st small {
            display: block;
            font-size: 12px;
            opacity: .85;
        }
        .ibs {
            display: flex;
            gap: 6px;
        }
        .ib {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 2px solid #fff;
            background: rgba(255,255,255,.15);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .ib:active {
            background: rgba(255,194,51,.5);
        }
        #pbw {
            flex: none;
            height: 6px;
            background: rgba(255,255,255,.2);
        }
        #pb {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg,#ffc233,#ff7043);
            transition: width .4s;
        }
        #area {
            flex: 1;
            display: flex;
            overflow: auto;
            padding: 10px;
        }
        #board {
            position: relative;
            margin: auto;
            flex: none;
            border: 3px solid rgba(255,255,255,.45);
            border-radius: 8px;
            background: rgba(0,0,0,.35);
            box-shadow: 0 8px 30px rgba(0,0,0,.5);
        }
        #board.complete {
            border-color: #ffc233;
            box-shadow: 0 0 40px rgba(255,194,51,.9);
        }
        #board.complete .slot {
            border: 0;
        }
        #board.complete .pc.placed {
            border: 0;
        }
        .gi {
            position: absolute;
            inset: 0;
            background-size: 100% 100%;
            opacity: .16;
            pointer-events: none;
            transition: opacity .3s;
        }
        .slot {
            position: absolute;
            border: 1px dashed rgba(255,255,255,.35);
            background: rgba(255,255,255,.04);
        }
        .slot.target {
            background: rgba(255,215,0,.45);
            border: 3px solid #ffd700;
            animation: glow .8s ease-in-out infinite alternate;
            z-index: 5;
        }
        @keyframes glow {
            to {
                box-shadow: 0 0 22px #ffd700;
                background: rgba(255,215,0,.7);
            }
        }
        .slot.done {
            pointer-events: none;
            border: 0;
            background: none;
        }
        .slot.no {
            animation: shk .35s;
        }
        #tray {
            flex: none;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 14px 12px calc(env(safe-area-inset-bottom,0px) + 14px);
            background: rgba(0,0,0,.6);
            border-top: 3px solid #ffc233;
            min-height: 96px;
        }
        .pc {
            flex: none;
            position: relative;
            background-repeat: no-repeat;
            border: 3px solid #fff;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,.5);
            touch-action: pan-x;
            cursor: grab;
            animation: in .35s ease-out backwards;
        }
        @keyframes in {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
        }
        .pc.sel {
            border-color: #ffd700;
            transform: translateY(-8px) scale(1.08);
            box-shadow: 0 0 18px #ffd700;
            z-index: 3;
        }
        .pc.shake {
            animation: shk .35s;
        }
        @keyframes shk {
            20% {
                transform: translateX(-6px);
            }
            40% {
                transform: translateX(6px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }
        .pc.placed {
            position: absolute;
            border: 1px solid rgba(255,255,255,.3);
            border-radius: 0;
            pointer-events: none;
            box-shadow: none;
            transform: none;
            cursor: default;
            animation: pop .45s ease-out;
        }
        @keyframes pop {
            0% {
                transform: scale(1.35);
                filter: brightness(1.8);
            }
            100% {
                transform: none;
                filter: none;
            }
        }
        .gh {
            position: fixed;
            z-index: 500;
            pointer-events: none;
            border: 3px solid #ffd700;
            background-repeat: no-repeat;
            box-shadow: 0 14px 26px rgba(0,0,0,.6);
            transform: scale(1.06);
        }
        .sk {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 600;
            animation: sk .7s ease-out forwards;
        }
        @keyframes sk {
            to {
                transform: translate(var(--dx),var(--dy)) scale(.2);
                opacity: 0;
            }
        }
        #toast {
            position: fixed;
            left: 0;
            right: 0;
            top: 20%;
            text-align: center;
            font: 900 36px 'Zen Antique Soft',serif;
            color: #ffeb3b;
            text-shadow: 0 0 18px #ff9800,0 3px 8px #000;
            opacity: 0;
            pointer-events: none;
            z-index: 300;
        }
        #toast.go {
            animation: tst 1.1s ease-out;
        }
        @keyframes tst {
            0% {
                opacity: 0;
                transform: scale(.6);
            }
            20% {
                opacity: 1;
                transform: scale(1.1);
            }
            75% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-16px);
            }
        }
        .ov {
            position: fixed;
            inset: 0;
            z-index: 400;
            background: rgba(15,10,40,.97);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: safe center;
            gap: 12px;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }
        .ov.off {
            display: none;
        }
        h1 {
            font: 900 38px 'Zen Antique Soft',serif;
            color: #ffc233;
            text-shadow: 0 0 20px rgba(255,194,51,.7);
        }
        p {
            font-size: 17px;
            line-height: 1.6;
        }
        .btn {
            min-width: 230px;
            min-height: 60px;
            border: 0;
            border-radius: 30px;
            background: #ffc233;
            color: #2b1d00;
            font: 600 24px 'Klee One',sans-serif;
            box-shadow: 0 6px 0 #b8861a;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b8861a;
        }
        .btn.g {
            background: transparent;
            color: #fff;
            border: 3px solid #fff;
            box-shadow: none;
            min-height: 50px;
            font-size: 19px;
        }
        .btn.r {
            background: #e63946;
            color: #fff;
            box-shadow: 0 6px 0 #9b2430;
        }
        .lv {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: min(92%,380px);
        }
        .lvb {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-radius: 18px;
            border: 3px solid rgba(255,255,255,.4);
            background: rgba(255,255,255,.08);
            color: #fff;
            font: 600 20px 'Klee One',sans-serif;
            cursor: pointer;
        }
        .lvb small {
            font-size: 13px;
            opacity: .9;
            display: block;
            text-align: right;
        }
        .lvb.sel {
            background: #ffc233;
            color: #2b1d00;
            border-color: #ffc233;
        }
        .chip {
            background: rgba(255,255,255,.15);
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 14px;
            padding: 5px 12px;
            font-size: 17px;
        }
        .stars {
            font-size: 54px;
            letter-spacing: 6px;
        }
        .bb {
            font-size: 22px;
            color: #ffeb3b;
            font-weight: 600;
        }
        .tv {
            font-size: 15px;
            color: #c8e6c9;
            max-width: 440px;
            line-height: 1.6;
        }
        .bd {
            background: rgba(255,255,255,.14);
            border: 2px solid #ffd700;
            border-radius: 16px;
            padding: 10px 6px;
            font-size: 14px;
        }
        .bd.l {
            opacity: .4;
            border-color: #888;
        }
        .bd b {
            display: block;
            font-size: 16px;
        }
        .bd .i {
            font-size: 36px;
        }
        .conf {
            position: fixed;
            top: -40px;
            font-size: 28px;
            animation: fall linear forwards;
            pointer-events: none;
            z-index: 700;
        }
        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
        #prev img {
            max-width: 92%;
            max-height: 80%;
            border-radius: 10px;
        }
        /*device-fix*/
        button,a {
            touch-action: manipulation;
        }
        html {
            -webkit-text-size-adjust: 100%;
        }
        @supports (-webkit-touch-callout:none) {
            * {
                -webkit-backdrop-filter: none!important;
                backdrop-filter: none!important;
            }
            body {
                background-attachment: scroll!important;
            }
        }
        /*tablet*/
        @media(min-width:768px) {
            .ov {
                zoom: 1.2;
            }
            #ui {
                zoom: 1.15;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="ui">
            <div id="st">⏱ <span id="tm">0:00</span> ・ 🧩 <span id="pg">0/0</span><small id="hn"></small></div>
            <div class="ibs">
                <button class="ib" id="hintB" title="ヒント">💡</button>
                <button class="ib" id="prevB" title="完成図">🖼</button>
                <button class="ib" id="ghB" title="うっすら完成図">👻</button>
                <button class="ib" id="zmO">➖</button>
                <button class="ib" id="zmI">➕</button>
                <button class="ib" id="sndB">🔊</button>
                <button class="ib" id="quitB">🚪</button>
            </div>
        </div>
        <div id="pbw">
            <div id="pb"></div>
        </div>
        <div id="area">
            <div id="board"></div>
        </div>
        <div id="tray"></div>
    </div>
    <div id="toast"></div>
    <div id="start" class="ov">
        <h1>🧩 かまんてパズル</h1>
        <p>ピースをタップ→光ったところをタップ！<br>ドラッグで置いてもOK。むずかしいときは💡ヒント</p>
        <div class="lv" id="lv"></div>
        <button class="btn" id="goB">スタート！</button>
        <button class="btn g" id="bdB">🏅 バッジ</button>
        <a class="btn g" href="index.html">🏠 もどる</a>
        <div class="tv" id="tvS"></div>
    </div>
    <div id="confirm" class="ov off">
        <h1 style="font-size:28px">やめますか？</h1>
        <p>今のとちゅうの記録は残りません。</p>
        <button class="btn" id="noB">つづける</button>
        <button class="btn r" id="yesB">やめる</button>
    </div>
    <div id="prev" class="ov off">
        <img id="pimg">
        <p>タップでとじる</p>
    </div>
    <div id="badges" class="ov off" style="justify-content:flex-start">
        <h1>🏅 バッジ</h1>
        <div id="bl" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(94%,520px)"></div>
        <button class="btn g" id="cbB">とじる</button>
    </div>
    <div id="result" class="ov off">
        <div class="stars" id="rs"></div>
        <div class="bb" id="rb"></div>
        <div class="chip">⏱ タイム <b id="rt">0:00</b></div>
        <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
            <span class="chip" id="rl"></span>
            <span class="chip">💡 <b id="rh">0</b>回</span>
            <span class="chip">🔥 <b id="rc">0</b>れんぞく</span>
        </div>
        <p class="bb" id="rp"></p>
        <div class="bb" id="rn" style="font-size:19px;line-height:1.6"></div>
        <p style="font-size:15px">🎫 チケット <b id="rk">0</b>枚 ・ ⭐ 経験値 <b id="re">0</b></p>
        <button class="btn" id="againB">もういちど</button>
        <button class="btn g" id="chgB">むずかしさをえらぶ</button>
        <a class="btn g" href="index.html">🏠 ホームへ</a>
        <div class="tv" id="tvR"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
    <script>
        const supabaseUrl = 'https://lmfukinengwrfknbofqq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxtZnVraW5lbmd3cmZrbmJvZnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI1MjM3NTEsImV4cCI6MjA3ODA5OTc1MX0.YeViGgs1cHWVQfTXimwXN5brg-vxjRUQeacqDHz58TI';
        const { createClient } = supabase;
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        async function saveBestRankingToSupabase(difficulty, score) {
            const userId = localStorage.getItem('sessionUserId');
            if (!userId) return;

            const gameType = `puzzle_${difficulty}`;

            try {
                const { data, error } = await supabaseClient
                .from('game_rankings')
                .select('score')
                .eq('user_id', userId)
                .eq('game_type', gameType)
                .single();

                let isBetter = false;
                if (!data || score < data.score) {
                    isBetter = true;
                }

                if (isBetter) {
                    await supabaseClient
                    .from('game_rankings')
                    .upsert({
                        user_id: userId,
                        game_type: gameType,
                        score: score,
                        updated_at: new Date().toISOString()
                        }, {
                            onConflict: 'user_id,game_type'
                        });

                    console.log(`✅ [${gameType}] 新記録: ${score}秒`);
                }
            } catch (error) {
                console.error(`[${gameType}]ランキング保存失敗:`, error);
            }
        }

        // 1日に満額でもらえるのは6回まで。それ以降は、少なめ(3割)

        function ticketReward(base) {
            const d = new Date(), key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
            let L = {};
            try {
                L = JSON.parse(localStorage.getItem('kamanteTicketLog')) || {}
            } catch (e) {}
            if (L.d !== key)L = {d: key, n: 0};
            L.n++;
            try {
                localStorage.setItem('kamanteTicketLog', JSON.stringify(L))
            } catch (e) {}
            return L.n <= 6 ? base : Math.max(1, Math.round(base * .3))
        }
        const $ = id => document.getElementById(id), rnd = (a, b) => a + Math.random() * (b - a);
        const J = (k, d) => {
            try {
                return JSON.parse(localStorage.getItem(k)) || d
            } catch (e) {
                return d
            }
        };
        const TRIVIA = [
            '玉利の鎌手踊り(たまりのかまんておどり)は、今から約240年前に、豊作を願い、病気をせず元気に過ごせるようにと祈って伝わってきた踊りです。',
            '玉利の鎌手踊りは、鹿児島市が指定した「郷土芸能」です。その土地に伝わる、大切な芸能のことです。',
            '踊り手は「鎌」の6人と「棒」の6人。みんなで力を合わせて踊ります。',
            '歌い手の歌に合わせて、鎌と棒を激しく打ち合わせるのが見どころです。',
            '今は高校生が授業の中で練習し、デイサービスや小学校で披露して、踊りを次の世代へつないでいます。'
        ];
        const tv = () => '💡 ' + TRIVIA[Math.floor(Math.random() * TRIVIA.length)];
        const LV = {
            easy: {n: 20, img: 'easy.png', name: 'やさしい', star: [90, 180], th: 100},
            normal: {n: 48, img: 'normal.png', name: 'ふつう', star: [240, 420], th: 84},
            hard: {n: 100, img: 'hard.png', name: 'むずかしい', star: [600, 1000], th: 70}
        };
        const GR = {20: [4, 5], 48: [6, 8], 100: [10, 10]};
        const PB = [
            {id: 'first', i: '🌱', n: 'はじめてのパズル', d: 'パズルを完成させた', f: () => true},
            {id: 'easy60', i: '⚡', n: 'はやわざ', d: 'やさしいを60秒いないで', f: g => g.key === 'easy' && g.T <= 60},
            {id: 'normal', i: '🧩', n: 'パズルめいじん', d: 'ふつうを完成', f: g => g.key === 'normal'},
            {id: 'hard', i: '👑', n: 'パズルマスター', d: 'むずかしいを完成', f: g => g.key === 'hard'},
            {id: 'nohint', i: '🧠', n: 'じりき', d: 'ヒントなしで完成', f: g => g.hints === 0},
            {id: 'cmb', i: '🔥', n: 'れんぞくピタ', d: '5れんぞくでピタッ', f: g => g.maxCombo >= 5},
            {id: 'star3', i: '🌟', n: '三つ星', d: '星3つ', f: g => g.stars === 3},
            {id: 'p10', i: '🏮', n: 'かまんてファン', d: '10回あそんだ', f: g => g.plays >= 10}
        ];

        // ---- 音 ----
        let ac = null, set = J('kamanteSettings', {});
        let sndOn = set.sound !== false;

        function tone(f1, f2, d, type = 'sine', v = .25, dl = 0) {
            if (!ac || !sndOn)return;
            const t = ac.currentTime + dl, o = ac.createOscillator(), g = ac.createGain();
            o.type = type;
            o.frequency.setValueAtTime(f1, t);
            o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d);
            g.gain.setValueAtTime(v, t);
            g.gain.exponentialRampToValueAtTime(.001, t + d);
            o.connect(g);
            g.connect(ac.destination);
            o.start(t);
            o.stop(t + d)
        }
        const sfx = {
            pick: () => tone(600, 850, .07, 'triangle'),
            place: c => {
                tone(520 + c * 40, 1040 + c * 40, .12, 'triangle', .3);
                tone(900 + c * 40, 1300, .1, 'sine', .15, .08)
            },
            wrong: () => tone(240, 130, .18, 'sine', .25),
            cheer: () => [523, 659, 784].forEach((f, i) => tone(f, f, .15, 'triangle', .25, i * .08)),
            win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f, .3, 'triangle', .28, i * .12))
        };

        function ensureAudio() {
            if (!ac) {
                try {
                    ac = new (window.AudioContext || window.webkitAudioContext)()
                } catch (e) {}
            }
            ac && ac.state === 'suspended' && ac.resume()
        }

        function setSnd(v) {
            sndOn = v;
            const s = J('kamanteSettings', {});
            s.sound = v;
            localStorage.setItem('kamanteSettings', JSON.stringify(s));
            $('sndB').textContent = v ? '🔊' : '🔇'
        }
        setSnd(sndOn);
        $('sndB').onclick = () => {
            ensureAudio();
            setSnd(!sndOn)
        };
        const vib = n => navigator.vibrate && navigator.vibrate(n);

        // ---- 状態 ----
        let S = {}, key = localStorage.getItem('kamantePzLv') || 'easy', tick = null, drag = null, pzTime = 0;
        if (!LV[key])key = 'easy';

        function renderLv() {
            const b = (J('puzzleGameStats', {}).best) || {};
            $('lv').innerHTML = Object.keys(LV).map(k => `<button class="lvb ${k === key ? 'sel' : ''}" data-k="${k}"><span>${LV[k].name}<small style="text-align:left">${LV[k].n}ピース</small></span><small>${b[k] ? 'ベスト ' + fmt(b[k]) : 'まだ未クリア'}</small></button>`).join('');
            document.querySelectorAll('.lvb').forEach(e => e.onclick = () => {
                key = e.dataset.k;
                localStorage.setItem('kamantePzLv', key);
                renderLv()
                })
        }
        const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
        renderLv();
        $('tvS').textContent = tv();

        function toast(t) {
            const e = $('toast');
            e.textContent = t;
            e.classList.remove('go');
            void e.offsetWidth;
            e.classList.add('go')
        }

        $('goB').onclick = () => {
            ensureAudio();
            begin()
        };
        $('againB').onclick = () => {
            ensureAudio();
            $('result').classList.add('off');
            begin()
        };
        $('chgB').onclick = () => {
            $('result').classList.add('off');
            $('start').classList.remove('off');
            renderLv()
        };

        function begin() {
            const L = LV[key], img = new Image();
            img.onload = () => {
                S = {
                    key,
                    img,
                    asp: img.width / img.height,
                    placed: 0,
                    hints: 0,
                    combo: 0,
                    maxCombo: 0,
                    last: 0,
                    sel: null,
                    zoom: 1,
                    t0: Date.now(),
                    playing: true,
                    ghost: key === 'easy',
                    pm: 0
                };
                const m = GR[L.n];
                S.cols = S.asp >= 1 ? m[1] : m[0];
                S.rows = S.asp >= 1 ? m[0] : m[1];
                S.N = S.cols * S.rows;
                $('start').classList.add('off');
                build();
                clearInterval(tick);
                tick = setInterval(uiTick, 500);
                uiTick()
            };
            img.onerror = () => alert('画像「' + L.img + '」が見つかりません。\nファイルが同じフォルダにあるか確認してね。');
            img.src = L.img;
        }

        function fit() {
            const a = $('area'), aw = a.clientWidth - 26, ah = a.clientHeight - 26;
            let w = Math.min(aw, ah * S.asp);
            w = Math.max(120, w * S.zoom);
            const b = $('board');
            b.style.width = w + 'px';
            b.style.height = (w / S.asp) + 'px';
            S.bw = w;
            S.bh = w / S.asp
        }

        function bgStyle(el, c, r) {
            el.style.backgroundImage = `url(${S.img.src})`;
            el.style.backgroundSize = `${S.cols * 100}% ${S.rows * 100}%`;
            el.style.backgroundPosition = `${S.cols > 1 ? c / (S.cols - 1) * 100 : 0}% ${S.rows > 1 ? r / (S.rows - 1) * 100 : 0}%`
        }

        function build() {
            const b = $('board'), tray = $('tray');
            b.innerHTML = '';
            b.classList.remove('complete');
            tray.innerHTML = '';
            const gi = document.createElement('div');
            gi.className = 'gi';
            gi.style.backgroundImage = `url(${S.img.src})`;
            gi.style.opacity = S.ghost ? .16 : 0;
            b.appendChild(gi);
            S.gi = gi;
            fit();
            S.slots = [];
            const th = LV[key].th, pa = S.asp * S.rows / S.cols, arr = [];
            for (let r = 0; r < S.rows; r++)for (let c = 0; c < S.cols; c++) {
                const i = r * S.cols + c;
                const s = document.createElement('div');
                s.className = 'slot';
                s.style.cssText = `left:${c / S.cols * 100}%;top:${r / S.rows * 100}%;width:${100 / S.cols}%;height:${100 / S.rows}%`;
                s.dataset.i = i;
                b.appendChild(s);
                S.slots.push(s);
                s.addEventListener('pointerdown', e => {
                    e.preventDefault();
                    slotTap(s)
                    });
                const p = document.createElement('div');
                p.className = 'pc';
                p.dataset.i = i;
                p.dataset.c = c;
                p.dataset.r = r;
                p.style.width = (th * pa) + 'px';
                p.style.height = th + 'px';
                bgStyle(p, c, r);
                arr.push(p)
            }
            arr.sort(() => Math.random() - .5).forEach((p, k) => {
                p.style.animationDelay = Math.min(k * 25, 600) + 'ms';
                tray.appendChild(p)
                });
            $('hn').textContent = '';
            updUI();
        }
        addEventListener('resize', () => {
            if (S.playing)fit()
            });

        function uiTick() {
            if (!S.playing)return;
            const e = Math.floor((Date.now() - S.t0) / 1000) + S.hints * 10;
            $('tm').textContent = fmt(e);
            S.el = e
        }

        function updUI() {
            $('pg').textContent = S.placed + '/' + S.N;
            $('pb').style.width = (S.placed / S.N * 100) + '%';
            $('hn').textContent = S.hints ? `ヒント ${S.hints}回(+${S.hints * 10}秒)` : ''
        }

        // ---- 選ぶ・置く ----

        function select(pc) {
            if (S.sel) {
                S.sel.classList.remove('sel');
                S.slots[+S.sel.dataset.i].classList.remove('target')
            }
            S.sel = pc;
            if (!pc)return;
            pc.classList.add('sel');
            const s = S.slots[+pc.dataset.i];
            s.classList.add('target');
            sfx.pick();
            s.scrollIntoView({block: 'center', inline: 'center', behavior: 'smooth'});
        }

        function slotTap(s) {
            if (!S.playing || s.classList.contains('done'))return;
            if (!S.sel) {
                toast('ピースをえらんでね');
                return
            }
            if (+s.dataset.i === +S.sel.dataset.i) {
                place(S.sel)
            } else {
                wrong(s, S.sel)
            }
        }

        function wrong(s, pc) {
            sfx.wrong();
            vib(30);
            if (s) {
                s.classList.remove('no');
                void s.offsetWidth;
                s.classList.add('no')
            }
            if (pc) {
                pc.classList.remove('shake');
                void pc.offsetWidth;
                pc.classList.add('shake')
            }
        }

        function sparkle(el) {
            const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
            for (let i = 0; i < 12; i++) {
                const d = document.createElement('i');
                d.className = 'sk';
                d.style.left = cx - 4 + 'px';
                d.style.top = cy - 4 + 'px';
                const a = rnd(0, 6.28), v = rnd(30, 90);
                d.style.setProperty('--dx', Math.cos(a) * v + 'px');
                d.style.setProperty('--dy', Math.sin(a) * v + 'px');
                d.style.background = `hsl(${rnd(30, 60)},100%,${rnd(55, 75)}%)`;
                document.body.appendChild(d);
                setTimeout(() => d.remove(), 750)
            }
        }

        function place(pc) {
            const i = +pc.dataset.i, s = S.slots[i];
            s.classList.add('done');
            s.classList.remove('target');
            if (S.sel === pc)S.sel = null;
            pc.classList.remove('sel', 'shake');
            pc.style.cssText = `left:${pc.dataset.c / S.cols * 100}%;top:${pc.dataset.r / S.rows * 100}%;width:${100 / S.cols}%;height:${100 / S.rows}%;`;
            pc.style.backgroundImage = `url(${S.img.src})`;
            bgStyle(pc, +pc.dataset.c, +pc.dataset.r);
            pc.classList.add('placed');
            $('board').appendChild(pc);
            const now = Date.now();
            S.combo = now - S.last < 6000 ? S.combo + 1 : 1;
            S.last = now;
            S.maxCombo = Math.max(S.maxCombo, S.combo);
            S.placed++;
            sfx.place(Math.min(S.combo, 8));
            vib(15);
            sparkle(s);
            if (S.combo >= 3 && S.placed < S.N)toast('🔥 ' + S.combo + ' れんぞく！');
            const pc2 = S.placed / S.N, ms = [[.25, 'いいぞ！'], [.5, 'はんぶん！'], [.75, 'もうすこし！']];
            ms.forEach(([t, x], k) => {
                if (pc2 >= t && S.pm <= k) {
                    S.pm = k + 1;
                    if (S.placed < S.N) {
                        toast(x);
                        sfx.cheer()
                    }
                }
                });
            updUI();
            if (S.placed === S.N)win();
        }
        // ---- ドラッグ ----
        $('tray').addEventListener('pointerdown', e => {
            ensureAudio();
            const pc = e.target.closest('.pc');
            if (!S.playing || !pc || pc.classList.contains('placed'))return;
            drag = {pc, x: e.clientX, y: e.clientY, on: false, touch: e.pointerType !== 'mouse'}
            });
        addEventListener('pointermove', e => {
            if (!drag)return;
            if (!drag.on && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 10) {
                drag.on = true;
                select(drag.pc);
                const g = document.createElement('div'), r = S.bw / S.cols, h = S.bh / S.rows;
                g.className = 'gh';
                g.style.width = r + 'px';
                g.style.height = h + 'px';
                bgStyle(g, +drag.pc.dataset.c, +drag.pc.dataset.r);
                document.body.appendChild(g);
                drag.g = g;
                drag.pc.style.opacity = .3
            }
            if (drag.on) {
                const g = drag.g;
                g.style.left = e.clientX - g.offsetWidth / 2 + 'px';
                g.style.top = e.clientY - g.offsetHeight / 2 - (drag.touch ? 60 : 0) + 'px'
            }
            });

        function endDrag(e, cancel) {
            if (!drag)return;
            const d = drag;
            drag = null;
            if (!d.on) {
                if (!cancel)select(S.sel === d.pc ? null : d.pc);
                return
            }
            const r = d.g.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
            d.g.remove();
            d.pc.style.opacity = '';
            if (cancel)return;
            const s = S.slots[+d.pc.dataset.i], sr = s.getBoundingClientRect();
            if (Math.hypot(cx - (sr.left + sr.width / 2), cy - (sr.top + sr.height / 2)) < Math.max(sr.width, sr.height) * .85)place(d.pc);
            else {
                const over = S.slots.find(x => {
                    const q = x.getBoundingClientRect();
                    return cx > q.left && cx < q.right && cy > q.top && cy < q.bottom && !x.classList.contains('done')
                    });
                if (over)wrong(over, d.pc)
            }
        }
        addEventListener('pointerup', e => endDrag(e));
        addEventListener('pointercancel', e => endDrag(e, true));

        // ---- ボタン ----
        $('hintB').onclick = () => {
            if (!S.playing)return;
            const left = [...document.querySelectorAll('#tray .pc')];
            if (!left.length)return;
            const pc = left[Math.floor(Math.random() * left.length)];
            S.hints++;
            updUI();
            select(pc);
            pc.scrollIntoView({inline: 'center', block: 'nearest', behavior: 'smooth'});
            toast('💡 ここだよ！ (+10びょう)')
        };
        $('prevB').onclick = () => {
            if (!S.img)return;
            $('pimg').src = S.img.src;
            $('prev').classList.remove('off')
        };
        $('prev').onclick = () => $('prev').classList.add('off');
        $('ghB').onclick = () => {
            if (!S.gi)return;
            S.ghost = !S.ghost;
            S.gi.style.opacity = S.ghost ? .16 : 0
        };
        const zm = f => {
            if (!S.playing)return;
            S.zoom = Math.max(.7, Math.min(3, S.zoom * f));
            fit()
        };
        $('zmI').onclick = () => zm(1.25);
        $('zmO').onclick = () => zm(.8);
        $('quitB').onclick = () => $('confirm').classList.remove('off');
        $('noB').onclick = () => $('confirm').classList.add('off');
        $('yesB').onclick = () => location.href = 'index.html';
        const getBD = () => J('kamantePuzzleBadges', {});
        $('bdB').onclick = () => {
            const d = getBD();
            $('bl').innerHTML = PB.map(b => `<div class="bd ${d[b.id] ? '' : 'l'}"><div class="i">${d[b.id] ? b.i : '🔒'}</div><b>${b.n}</b>${b.d}</div>`).join('');
            $('badges').classList.remove('off')
        };
        $('cbB').onclick = () => $('badges').classList.add('off');

        // ---- クリア ----

        async function win() {
            S.playing = false;
            clearInterval(tick);
            sfx.win();
            vib([60, 40, 60, 40, 120]);
            const T = Math.floor((Date.now() - S.t0) / 1000) + S.hints * 10, L = LV[key];
            $('board').classList.add('complete');
            S.gi.style.opacity = 0;
            toast('🎉 かんせい！');
            const em = ['🎊', '⭐', '🏮', '✨'];
            for (let i = 0; i < 32; i++) {
                const e = document.createElement('div');
                e.className = 'conf';
                e.textContent = em[i % 4];
                e.style.left = rnd(0, 100) + 'vw';
                e.style.animationDuration = rnd(2, 4) + 's';
                e.style.animationDelay = rnd(0, .8) + 's';
                document.body.appendChild(e);
                setTimeout(() => e.remove(), 5000)
            }
            const stars = T <= L.star[0] ? 3 : T <= L.star[1] ? 2 : 1;
            const st = J('puzzleGameStats', {playCount: 0, best: {}});
            st.best = st.best || {};
            st.playCount = (st.playCount || 0) + 1;
            const prev = st.best[key], isBest = !prev || T < prev;
            if (isBest)st.best[key] = T;
            st.bestTime = Math.min(...Object.values(st.best));
            localStorage.setItem('puzzleGameStats', JSON.stringify(st));
            const tickets = ticketReward(({easy: 5, normal: 8, hard: 12})[key] + (stars - 1) * 2), exp = Math.floor(Math.max(200 - Math.floor(T / 10), 50) * (key === 'easy' ? 1 : key === 'normal' ? 2 : 3));
            localStorage.setItem('ticketCount', (parseInt(localStorage.getItem('ticketCount')) || 0) + tickets);
            localStorage.setItem('gamePlayCount', (parseInt(localStorage.getItem('gamePlayCount')) || 0) + 1);
            try {
                const id = parseInt(localStorage.getItem('selectedCharacterId')) || 1, ch = JSON.parse(localStorage.getItem('characters')) || [], c = ch.find(x => x.id === id);
                if (c) {
                    c.exp = (c.exp || 0) + exp;
                    localStorage.setItem('characters', JSON.stringify(ch))
                }
            } catch (e) {}
            const sv = saveBestRankingToSupabase(key, T);
            const d = getBD(), g = {key, T, hints: S.hints, maxCombo: S.maxCombo, stars, plays: st.playCount}, nw = [];
            PB.forEach(b => {
                if (!d[b.id] && b.f(g)) {
                    d[b.id] = 1;
                    nw.push(b)
                }
                });
            localStorage.setItem('kamantePuzzleBadges', JSON.stringify(d));
            $('rs').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
            $('rb').textContent = isBest ? (prev ? '🎉 じこベスト こうしん！' : '🎉 はじめてのクリア！') : '';
            $('rt').textContent = fmt(T);
            $('rl').textContent = L.name + ' ' + L.n + 'ピース';
            $('rh').textContent = S.hints;
            $('rc').textContent = S.maxCombo;
            $('rp').textContent = '';
            $('rn').innerHTML = nw.map(b => '🏅 バッジGET！ ' + b.i + ' ' + b.n).join('<br>');
            $('rk').textContent = tickets;
            $('re').textContent = exp;
            $('tvR').textContent = tv();
            setTimeout(() => $('result').classList.remove('off'), 1800);
            sv.then(async() => {
                if (!localStorage.getItem('sessionUserId'))return;
                try {
                    const r = await supabaseClient.from('game_rankings').select('*', {count: 'exact', head: true}).eq('game_type', 'puzzle_' + key).lt('score', isBest ? T : prev);
                    if (r.count != null)$('rp').textContent = '🏆 ぜんたいで ' + (r.count + 1) + '位！'
                } catch (e) {}
                });
        }
    </script>
    <script src="kamante-bgm.js" data-bottom="170px"></script>
</body>
