<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>かまんて探訪 - かまんてびーと</title>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Antique+Soft&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffc233;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        html,body {
            height: 100%;
            overflow: hidden;
            background: #0b0820;
            font-family: 'Klee One',sans-serif;
            color: #fff8e7;
            touch-action: none;
        }
        #gl {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .off {
            display: none!important;
        }
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: calc(env(safe-area-inset-top,0px) + 8px) 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }
        #obj {
            background: rgba(10,8,40,.7);
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 16px;
            padding: 8px 12px;
            max-width: 62vw;
            backdrop-filter: blur(4px);
        }
        #objT {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
        }
        #objD {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--gold);
            margin-top: 2px;
        }
        #arrow {
            display: inline-block;
            font-size: 22px;
            transition: transform .1s;
        }
        #topR {
            display: flex;
            gap: 6px;
            pointer-events: auto;
        }
        .ib {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: rgba(0,0,0,.45);
            color: #fff;
            font-size: 19px;
        }
        #prog {
            position: fixed;
            top: calc(env(safe-area-inset-top,0px) + 62px);
            left: 10px;
            display: flex;
            gap: 5px;
            z-index: 10;
            pointer-events: none;
        }
        #prog i {
            width: 26px;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,.25);
        }
        #prog i.on {
            background: var(--gold);
            box-shadow: 0 0 8px var(--gold);
        }
        #joyZone {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 46vw;
            height: 46vh;
            z-index: 9;
            touch-action: none;
        }
        #joy {
            position: absolute;
            left: 28px;
            bottom: calc(env(safe-area-inset-bottom,0px) + 28px);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255,255,255,.12);
            border: 3px solid rgba(255,255,255,.4);
        }
        #knob {
            position: absolute;
            left: 35px;
            top: 35px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,.55);
            box-shadow: 0 0 12px rgba(0,0,0,.4);
        }
        #act {
            position: fixed;
            right: 20px;
            bottom: calc(env(safe-area-inset-bottom,0px) + 40px);
            z-index: 12;
            min-width: 130px;
            height: 84px;
            padding: 0 18px;
            border: 4px solid #fff;
            border-radius: 42px;
            background: linear-gradient(135deg,#ff7043,#e53935);
            color: #fff;
            font: 600 22px 'Klee One',sans-serif;
            box-shadow: 0 0 24px rgba(255,112,67,.8);
            animation: pl 1s infinite;
        }
        @keyframes pl {
            50% {
                box-shadow: 0 0 36px rgba(255,112,67,1);
            }
        }
        #dlg {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: calc(env(safe-area-inset-bottom,0px) + 10px);
            z-index: 30;
            background: rgba(10,8,40,.92);
            border: 3px solid var(--gold);
            border-radius: 20px;
            padding: 12px 14px 14px;
            min-height: 140px;
            box-shadow: 0 0 30px rgba(0,0,0,.6);
        }
        #dtop {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        #por {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #fff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            flex: none;
            border: 3px solid var(--gold);
        }
        #por img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #por.pl {
            background: linear-gradient(135deg,#ffe9a8,#ffd1a8);
        }
        #por img.fc {
            object-position: 50% 18%;
            transform: scale(1.55);
            transform-origin: 50% 22%;
        }
        #who {
            font: 900 18px 'Zen Antique Soft',serif;
            color: var(--gold);
        }
        #dtx {
            font-size: 17px;
            line-height: 1.7;
            min-height: 56px;
        }
        #dnx {
            position: absolute;
            right: 16px;
            bottom: 8px;
            font-size: 14px;
            color: var(--gold);
            animation: bk 1s infinite alternate;
        }
        @keyframes bk {
            to {
                opacity: .3;
            }
        }
        #chs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }
        .chb {
            padding: 11px 14px;
            border: 2px solid #fff;
            border-radius: 14px;
            background: rgba(255,255,255,.12);
            color: #fff;
            font: 600 16px 'Klee One',sans-serif;
            text-align: left;
        }
        .ov {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }
        #title {
            background: radial-gradient(circle at 50% 30%,#4a2a6a,#0b0820);
            z-index: 80;
        }
        h1 {
            font: 900 clamp(34px,10vw,52px) 'Zen Antique Soft',serif;
            color: var(--gold);
            text-shadow: 0 0 24px rgba(255,194,51,.7),0 3px 0 #8a5a00;
        }
        .sub {
            font-size: 16px;
            opacity: .9;
            line-height: 1.7;
        }
        .btn {
            min-width: 240px;
            min-height: 60px;
            border: 0;
            border-radius: 30px;
            background: var(--gold);
            color: #2b1d00;
            font: 600 23px 'Klee One',sans-serif;
            box-shadow: 0 6px 0 #b8861a;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            cursor: pointer;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b8861a;
        }
        .btn.g {
            background: transparent;
            color: #fff;
            border: 3px solid #fff;
            box-shadow: none;
            min-height: 50px;
            font-size: 18px;
        }
        .btn.r {
            background: #e53935;
            color: #fff;
            box-shadow: 0 6px 0 #8e1a1a;
        }
        input {
            padding: 12px 16px;
            border-radius: 14px;
            border: 3px solid var(--gold);
            font: 600 20px 'Klee One',sans-serif;
            text-align: center;
            width: min(80vw,320px);
        }
        .help {
            background: rgba(255,255,255,.1);
            border-radius: 16px;
            padding: 10px 14px;
            font-size: 14px;
            line-height: 1.7;
            max-width: 420px;
        }
        #toast {
            position: fixed;
            left: 50%;
            top: 34%;
            transform: translate(-50%,-50%);
            z-index: 70;
            background: rgba(20,10,50,.96);
            border: 3px solid var(--gold);
            border-radius: 22px;
            padding: 16px 24px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 0 40px rgba(255,194,51,.6);
            animation: tp .4s cubic-bezier(.2,1.4,.4,1);
            pointer-events: none;
        }
        @keyframes tp {
            from {
                transform: translate(-50%,-50%) scale(.4);
                opacity: 0;
            }
        }
        #flt {
            position: fixed;
            left: 50%;
            top: 40%;
            transform: translateX(-50%);
            font: 900 34px 'Zen Antique Soft',serif;
            color: #ffeb3b;
            text-shadow: 0 0 18px #ff9800,0 3px 8px #000;
            pointer-events: none;
            z-index: 40;
            opacity: 0;
        }
        #flt.go {
            animation: ft 1.4s ease-out;
        }
        @keyframes ft {
            0% {
                opacity: 0;
                transform: translateX(-50%) scale(.6);
            }
            20% {
                opacity: 1;
                transform: translateX(-50%) scale(1.1);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-24px);
            }
        }
        #fade {
            position: fixed;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 90;
            transition: opacity .5s;
        }
        /* rhythm */
        #rh {
            background: rgba(10,8,40,.93);
            z-index: 60;
        }
        #rbig {
            position: relative;
            width: min(70vw,270px);
            aspect-ratio: 1;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 45%,#fff1c9 0 52%,#e6b867 53% 57%,#9c4a2b 58%);
            border: 6px solid #5d2e1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font: 900 60px 'Zen Antique Soft',serif;
            color: #c62828;
            box-shadow: 0 0 40px rgba(255,160,60,.5);
        }
        #rring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 8px solid #ffc233;
            pointer-events: none;
            opacity: 0;
        }
        #rbig.hit {
            animation: hit .15s;
        }
        @keyframes hit {
            50% {
                transform: scale(.92);
            }
        }
        #rdots {
            display: flex;
            gap: 8px;
        }
        #rdots i {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255,255,255,.2);
            border: 2px solid #fff;
        }
        #rdots i.ok {
            background: #7bd88f;
        }
        #rdots i.ng {
            background: #e53935;
        }
        /* battle */
        #bt {
            background: linear-gradient(180deg,#1a0f33,#3b1d5c 60%,#120a2a);
            z-index: 60;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);
        }
        #bt.shake {
            animation: shk .35s;
        }
        @keyframes shk {
            20% {
                transform: translate(-8px,4px);
            }
            40% {
                transform: translate(8px,-4px);
            }
            60% {
                transform: translate(-6px,-3px);
            }
            80% {
                transform: translate(6px,3px);
            }
        }
        .bs {
            position: relative;
            width: min(44vw,170px);
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 84px;
            overflow: hidden;
            background: #fff;
            border: 4px solid var(--gold);
        }
        .bs img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #bE .bs {
            background: radial-gradient(circle,#4a1a6a,#0b0820);
            border-color: #b388ff;
            box-shadow: 0 0 40px #7c4dff;
            animation: flo 3s ease-in-out infinite;
        }
        @keyframes flo {
            50% {
                transform: translateY(-10px);
            }
        }
        .bs.hurt {
            animation: hurt .4s;
        }
        @keyframes hurt {
            25% {
                transform: translateX(-12px);
                filter: brightness(2);
            }
            75% {
                transform: translateX(12px);
            }
        }
        .hpw {
            width: min(86vw,360px);
        }
        .hpn {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 3px;
        }
        .hpb {
            height: 16px;
            border-radius: 8px;
            background: rgba(255,255,255,.2);
            overflow: hidden;
        }
        .hpb i {
            display: block;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg,#43a047,#9ccc65);
            transition: width .5s;
        }
        .hpb i.low {
            background: linear-gradient(90deg,#e53935,#ff8a65);
        }
        .gb2 {
            height: 10px;
            margin-top: 5px;
            border-color: #ffc233;
        }
        .gb2 i {
            background: linear-gradient(90deg,#ffc233,#ff7043);
        }
        .gb2.full i {
            animation: gg .6s infinite alternate;
        }
        @keyframes gg {
            to {
                box-shadow: 0 0 14px #ffc233;
                filter: brightness(1.4);
            }
        }
        #blog {
            width: min(92vw,420px);
            height: 62px;
            overflow-y: auto;
            background: rgba(0,0,0,.5);
            border-radius: 12px;
            padding: 6px 10px;
            font-size: 14px;
            line-height: 1.5;
            text-align: left;
        }
        #bact {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 8px;
            width: min(92vw,420px);
        }
        .ab {
            height: 54px;
            border: 0;
            border-radius: 14px;
            font: 600 17px 'Klee One',sans-serif;
            color: #fff;
            box-shadow: 0 4px 0 rgba(0,0,0,.4);
        }
        .ab:active {
            transform: translateY(3px);
        }
        .ab:disabled {
            opacity: .4;
        }
        .ab.a {
            background: #e53935;
        }
        .ab.d {
            background: #1e88e5;
        }
        .ab.s {
            background: linear-gradient(135deg,#ffc233,#ff7043);
            color: #2b1d00;
        }
        .ab.h {
            background: #43a047;
        }
        .dmg {
            position: fixed;
            font: 900 34px 'Zen Antique Soft',serif;
            pointer-events: none;
            z-index: 200;
            text-shadow: 0 3px 8px #000;
            animation: dm .9s ease-out forwards;
        }
        @keyframes dm {
            to {
                transform: translateY(-70px);
                opacity: 0;
            }
        }
        .conf {
            position: fixed;
            top: -40px;
            font-size: 28px;
            animation: fall linear forwards;
            pointer-events: none;
            z-index: 300;
        }
        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
        .flashf {
            position: fixed;
            inset: 0;
            z-index: 250;
            pointer-events: none;
            animation: fl .5s ease-out forwards;
        }
        @keyframes fl {
            from {
                opacity: .9;
            }
            to {
                opacity: 0;
            }
        }
        #vig {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle,transparent 58%,rgba(10,5,30,.5));
            z-index: 5;
        }
        #cb1,#cb2 {
            position: fixed;
            left: 0;
            right: 0;
            height: 0;
            background: #000;
            z-index: 95;
            transition: height .6s;
            pointer-events: none;
        }
        #cb1 {
            top: 0;
        }
        #cb2 {
            bottom: 0;
        }
        #ctit {
            position: fixed;
            left: 0;
            right: 0;
            top: 38%;
            text-align: center;
            font: 900 clamp(30px,8vw,48px) 'Zen Antique Soft',serif;
            color: #fff;
            text-shadow: 0 0 24px #ffc233,0 4px 10px #000;
            opacity: 0;
            pointer-events: none;
            z-index: 96;
            line-height: 1.3;
        }
        #ctit.go {
            animation: ct 2.6s ease-out;
        }
        @keyframes ct {
            0% {
                opacity: 0;
                transform: scale(.8);
            }
            15% {
                opacity: 1;
                transform: scale(1);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-14px);
            }
        }
        #topR {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }
        #btns {
            display: grid;
            grid-template-columns: repeat(3,42px);
            gap: 6px;
        }
        #mm {
            border: 2px solid rgba(255,255,255,.4);
            border-radius: 10px;
            width: 70px;
            height: 130px;
            background: rgba(10,8,40,.6);
        }
        .ib.on {
            background: var(--gold);
            color: #2b1d00;
            border-color: var(--gold);
        }
        .lc {
            background: rgba(255,255,255,.1);
            border: 2px solid var(--gold);
            border-radius: 16px;
            padding: 10px 14px;
            text-align: left;
            font-size: 15px;
            line-height: 1.7;
        }
        .lc b {
            color: var(--gold);
            font-size: 17px;
        }
        .lc.lk {
            opacity: .5;
            border-color: #888;
        }
        .sb {
            padding: 9px 16px;
            border-radius: 14px;
            border: 2px solid #fff;
            background: transparent;
            color: #fff;
            font: 600 16px 'Klee One',sans-serif;
        }
        .sb.sel {
            background: var(--gold);
            color: #2b1d00;
            border-color: var(--gold);
        }
        .srow {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 18px;
        }
        #bt {
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: none!important;
            z-index: 60;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: calc(env(safe-area-inset-top,0px) + 8px) 10px calc(env(safe-area-inset-bottom,0px) + 8px);
        }
        #btTop {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: flex-start;
        }
        #btTop .bar {
            flex: 1;
            max-width: 48vw;
            background: rgba(10,8,40,.7);
            border: 2px solid rgba(255,255,255,.35);
            border-radius: 14px;
            padding: 6px 10px;
        }
        #btBot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        #bact {
            pointer-events: auto;
        }
        @media(orientation:landscape) {
            #bact {
                grid-template-columns: repeat(4,1fr)!important;
                width: min(86vw,640px)!important;
            }
            #blog {
                height: 48px!important;
            }
        }
        /*device-fix*/
        button,a {
            touch-action: manipulation;
        }
        html {
            -webkit-text-size-adjust: 100%;
        }
        @supports (-webkit-touch-callout:none) {
            * {
                -webkit-backdrop-filter: none!important;
                backdrop-filter: none!important;
            }
        }
    </style>
</head>
<body>
    <canvas id="gl"></canvas>
    <div id="vig"></div>
    <div id="cb1"></div>
    <div id="cb2"></div>
    <div id="ctit"></div>
    <div id="hud" class="off">
        <div id="obj">
            <div id="objT"></div>
            <div id="objD"><span id="arrow">➤</span><span id="dist"></span></div>
            <div id="cnt" style="font-size:12px;opacity:.9;margin-top:3px"></div>
        </div>
        <div id="topR">
            <div id="btns"><button class="ib" id="loreB">📖</button><button class="ib" id="autoB">🧭</button><button class="ib" id="setB">⚙</button><button class="ib" id="sndB">🔊</button><button class="ib" id="homeB">🏠</button></div>
            <canvas id="mm" width="70" height="130"></canvas>
        </div>
    </div>
    <div id="prog" class="off"><i></i><i></i><i></i><i></i><i></i></div>
    <div id="joyZone" class="off">
        <div id="joy">
            <div id="knob"></div>
        </div>
    </div>
    <button id="act" class="off">💬 はなす</button>
    <div id="flt"></div>
    <div id="fade"></div>
    <div id="dlg" class="off">
        <div id="dtop">
            <div id="por"></div>
            <div id="who"></div>
        </div>
        <div id="dtx"></div>
        <div id="chs"></div>
        <div id="dnx">▼ タップ</div>
    </div>
    <div id="title" class="ov">
        <h1>かまんて探訪</h1>
        <div class="sub">夕暮れの玉利の里を歩いて、<br>かまんて踊りの物語をたどろう</div>
        <input id="nm" type="text" maxlength="8" placeholder="なまえを入れてね">
        <button class="btn" id="startB">はじめる</button>
        <button class="btn g off" id="contB">つづきから</button>
        <div class="help">🕹 左下をなぞって歩く ・ 右側をなぞって見まわす<br>(パソコン: WASDで歩く・ドラッグで見まわす)<br>ボタンが出たらタップ！</div>
        <a class="btn g" href="index.html">🏠 ホームへ</a>
    </div>
    <div id="lore" class="ov off" style="background:rgba(10,8,40,.97);z-index:70;justify-content:flex-start">
        <h1 style="font-size:30px">📖 ひとことずかん</h1>
        <div id="loreL" style="display:grid;gap:10px;width:min(94vw,520px)"></div>

            g.gain.setValueAtTime(v, t);
            g.gain.exponentialRampToValueAtTime(.001, t + d);
            o.connect(g);
            g.connect(ac.destination);
            o.start(t);
            o.stop(t + d)

        function mkGlow() {
            const c = document.createElement('canvas');

        function distSeg(px, pz, a, b) {
            const dx = b.x - a.x, dz = b.z - a.z, l = dx * dx + dz * dz;
            let t = l ? ((px - a.x) * dx + (pz - a.z) * dz) / l : 0;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (a.x + dx * t), pz - (a.z + dz * t))
        }
        const pathDist = (x, z) => {
            let d = 99;
            for (let i = 0; i < ST.length - 1; i++)d = Math.min(d, distSeg(x, z, ST[i], ST[i + 1]));

        };

        function collide(nx, nz) {
            const R = .45;
            for (const c of COL) {
                if (c.t === 'c') {
                    const dx = nx - c.x, dz = nz - c.z, d = Math.hypot(dx, dz), m = c.r + R;
                    if (d < m && d > 0) {
                        nx = c.x + dx / d * m;
                        nz = c.z + dz / d * m
                    }
                }
                else {
                    const cx = Math.max(c.x1, Math.min(nx, c.x2)), cz = Math.max(c.z1, Math.min(nz, c.z2)), dx = nx - cx, dz = nz - cz, d = Math.hypot(dx, dz);
                    if (d < R) {
                        if (d > 0) {
                            nx = cx + dx / d * R;
                            nz = cz + dz / d * R
                        } else {
                            const l = nx - c.x1, r = c.x2 - nx, t = nz - c.z1, b = c.z2 - nz, m = Math.min(l, r, t, b);
                            if (m === l)nx = c.x1 - R; else if (m === r)nx = c.x2 + R; else if (m === t)nz = c.z1 - R; else nz = c.z2 + R
                        }
                    }
                }
            }
            return [
                Math.max(-BOUND.x, Math.min(BOUND.x, nx)),
                Math.max(BOUND.zmin, Math.min(BOUND.zmax, nz))
            ]
        }

            if (keys.ArrowLeft)yaw += dt * 1.8;

            if (auto) {

            }
            const l = Math.hypot(f, s), m = Math.min(1, l);
            if (l > .08) {
                f /= l;
                s /= l;
                const sp = 5 * m * dt, fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
                const [nx, nz] = collide(P.x + (fx * f + rx * s) * sp, P.z + (fz * f + rz * s) * sp);

                const a = rnd(0, 6.28), b = rnd(-1.4, 1.4), sp = rnd(6, 12);

                s.position.set(x, y, z);
                s.userData = {

                    vy: Math.sin(b) * sp,
                    vz: Math.sin(a) * Math.cos(b) * sp,
                    l: rnd(.9, 1.6)
                };
                s.material.color.copy(c);
                s.scale.set(2.2, 2.2, 1);
                if (++n >= 26)break
            }
        }

        function fwUpdate(dt) {
            for (const s of fwp) {
                if (!s.visible)continue;
                const u = s.userData;
                u.l -= dt;
                if (u.l <= 0) {
                    s.visible = false;
                    continue
                }
                u.vy -= 7 * dt;
                s.position.x += u.vx * dt;
                s.position.y += u.vy * dt;
                s.position.z += u.vz * dt;
                u.vx *= .985;
                u.vz *= .985;
                s.material.opacity = Math.min(1, u.l)

        // ---- 音楽・環境音 ----
        const MU = {mode: 'off', next: 0, tempo: .62, n: 0, amb: null};
        const PENT = [293.66, 329.63, 392, 440, 493.88, 587.33, 659.25], MINR = [293.66, 349.23, 392, 440, 523.25, 587.33];
        const musicSet = m => {

        function ambStart() {
            if (!ac || MU.amb)return;
            try {
                const b = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = b.getChannelData(0);
                for (let i = 0; i < d.length; i++)d[i] = Math.random() * 2 - 1;
                const s = ac.createBufferSource();
                s.buffer = b;
                s.loop = true;
                const f = ac.createBiquadFilter();
                f.type = 'lowpass';
                f.frequency.value = 420;
                const g = ac.createGain();
                g.gain.value = sndOn ? .03 : 0;
                s.connect(f);
                f.connect(g);

        async function pAct(a) {
            if (!B || B.busy)return;
            B.busy = true;
            bui();
            const e = B.e, p = B.p;
            if (a === 'a') {
                let d = Math.max(1, Math.round(p.attack * 1.5 + p.kamante * .3 - e.def + rnd(0, 3)));
                if (e.half) {
                    d = Math.max(1, Math.floor(d / 2));
                    e.half = false;
                    blog('影は身をかためている！ダメージ半分！')
                }
                await pAttackAnim();
                e.hp -= d;
                B.gauge = Math.min(100, B.gauge + 25);
                B.defending = false;
                blog(`${p.name}のこうげき！ ${d}ダメージ！`);
                dmgPop3(bSpr, d, '#fff')
            }
            else if (a === 'd') {
                B.defending = true;
                B.gauge = Math.min(100, B.gauge + 10);
                blog(`${p.name}は ぼうぎょのかまえ！`);
                await guardFx()
            }
            else if (a === 's') {
                blog(`✨ ${B.sp.name}！！`);
                const hits = await ({1: spec1, 2: spec2, 3: spec3, 4: spec4, 5: spec5}[p.id] || spec1)();
                let tot = Math.round(p.kamante * B.sp.spd + p.attack * .4);
                e.half = false;
                B.gauge = 0;
                B.defending = false;
                if (p.id === 5 && Math.random() < .35) {
                    e.stun = true;
                    blog('敵は目をまわしている！(気絶)')
                }
                if (p.id === 1) {
                    B.guard = true;
                    blog('ぼうぎょ力アップ！つぎのダメージ半分')
                }
                if (p.id === 3) {
                    const h = Math.round(B.pmax * .25);
                    B.ph = Math.min(B.pmax, B.ph + h);
                    blog(`🌸 HPが ${h} かいふく！`)
                }
                if (p.id === 4) {
                    e.blind = true;
                    blog('敵はまぶしくて、こうげきが弱まる！')
                }
                e.hp -= tot;
                blog(`${B.sp.name}！ ${tot}ダメージ！`);
                if (hits > 1) {
                    for (let i = 0; i < hits; i++) {
                        dmgPop3(bSpr, Math.round(tot / hits), '#ffeb3b', 3 + i * 1.2);
                        await fwait(140)
                    }
                } else dmgPop3(bSpr, tot, '#ffeb3b')
            }
            else if (a === 'h') {
                const h = Math.round(B.pmax * .3);
                B.ph = Math.min(B.pmax, B.ph + h);
                B.heals--;
                blog(`🙏 いのりで HPが ${h} かいふく！`);
                sfx.heal();
                dmgPop3(pSpr, '+' + h, '#9cff9c', 3);
                await healFx()
            }
            bui();
            if (e.hp <= 0) {
                await fwait(500);
                return battleEnd(true)
            }
            await fwait(700);
            enemyTurn()
        }
        const hitP = (mult, txt) => {
            const e = B.e, p = B.p;
            let d = Math.max(1, Math.round(e.base * mult - p.defense * .3 + rnd(-1, 1)));
            if (e.blind)d = Math.max(1, Math.floor(d * .5));
            if (B.guard)d = Math.max(1, Math.floor(d * .5));
            if (B.defending) {
                d = Math.max(1, Math.floor(d / 2));
                blog('ぼうぎょで ダメージ半分！')
            }
            return d
        };

        async function enemyTurn() {
            const e = B.e, p = B.p;
            if (e.stun) {
                e.stun = false;
                blog('敵はまだ ふらふらしている…');
                await fwait(600);
                B.guard = false;
                B.defending = false;
                B.busy = false;
                bui();
                return
            }
            let act = 'a';
            const r = Math.random(), hp = e.hp / e.max;
            if (e.charging)act = 'u'; else if (hp > .6) {
                act = r < .6 ? 'a' : r < .85 ? 's' : 'd'
            } else {
                act = r < .4 ? 'a' : r < .65 ? 's' : r < .8 ? 'c' : 'd'
            }
            if (act === 'a' || act === 's' || act === 'u') {
                const mult = act === 'a' ? 1 : act === 's' ? 1.5 : 2.4, d = hitP(mult);
                e.charging = false;
                blog(act === 'a' ? '影のこうげき！' : act === 's' ? '影の強いこうげき！' : '💥 影のひっさつ！');
                await eAttackAnim(mult);
                if (act === 'u')gflash('#ff1744');
                B.ph -= d;
                blog(`${d}ダメージを受けた！`);
                dmgPop3(pSpr, d, '#ff8a80', 3.2);
                bui()
            }
            else if (act === 'c') {
                e.charging = true;
                blog('⚠️ 影が ちからを ためている…！ぼうぎょしよう！');
                sfx.wave();
                gflash('#7c4dff');
                shakeAmt = .35;
                tint(bSpr, 0xff4040, 600);
                for (let i = 0; i < 16 * FXQ; i++) {
                    const b = bpos();

                }
                await fwait(700)
            }
            else {
                e.half = true;
                blog('影は 身をかためた…');
                tint(bSpr, 0x8888ff, 500);
                await fwait(500)
            }
            e.blind = false;
            B.guard = false;
            B.defending = false;
            B.busy = false;
            bui();
            if (B.ph <= 0) {
                await fwait(500);
                battleEnd(false)
            }
        }

        // ===== たいこチャレンジ =====
        let rhS = null, rhFail = 0;

        function startRhythm() {
            if (mode !== 'explore')return;
            mode = 'task';
            rhFail = 0;
            $('rh').classList.remove('off');
            rhAttempt()
        }

        function rhAttempt() {
            const N = 8, gap = 820, lead = 1800, ap = 1200;
            rhS = {
                t0: performance.now(),
                N,
                ap,
                notes: [...Array(N)].map((_, i) => ({t: lead + i * gap, done: false})),
                hits: 0,
                fin: false
            };
            $('rdots').innerHTML = '<i></i>'.repeat(N);
            $('rmsg').textContent = 'じゅんびして…';
            $('rskip').classList.add('off');
            requestAnimationFrame(rhLoop)
        }

        function rhLoop() {
            if (!rhS || rhS.fin)return;
            const el = performance.now() - rhS.t0, dots = $('rdots').children;
            let act = null;
            rhS.notes.forEach((n, i) => {
                if (!n.done && el > n.t + 330) {
                    n.done = true;
                    dots[i].classList.add('ng')
                }
                if (!n.done && el >= n.t - rhS.ap && !act)act = n
                });
            const ring = $('rring');
            if (act) {
                const p = Math.max(0, (act.t - el) / rhS.ap);
                ring.style.opacity = 1 - p * .5;
                ring.style.transform = `scale(${1 + p * 1.6})`
            } else ring.style.opacity = 0;
            if (el > rhS.notes[rhS.N - 1].t + 500) {
                rhS.fin = true;
                rhDone()
            } else requestAnimationFrame(rhLoop)
        }
        $('rbig').addEventListener('pointerdown', e => {
            e.stopPropagation();
            ensureAudio();
            if (!rhS || rhS.fin)return;
            const el = performance.now() - rhS.t0, b = $('rbig');
            b.classList.remove('hit');
            void b.offsetWidth;
            b.classList.add('hit');
            let best = null, bd = 999;
            rhS.notes.forEach((n, i) => {
                if (n.done)return;
                const d = Math.abs(el - n.t);
                if (d < bd) {
                    bd = d;
                    best = {n, i}
                }
                });
            if (best && bd < 330) {
                best.n.done = true;
                rhS.hits++;
                $('rdots').children[best.i].classList.add('ok');
                sfx.don();
                vib(20);
                $('rmsg').textContent = bd < 130 ? 'ぴったり！' : 'いいね！'
            } else {
                sfx.ka()
            }
            });

        async function rhDone() {
            const ok = rhS.hits >= 5;
            $('rring').style.opacity = 0;
            if (ok) {
                $('rmsg').textContent = `🎉 ${rhS.hits}/8 せいこう！`;
                sfx.fan();
                confetti(30);
                await wait(1500);
                $('rh').classList.add('off');
                mode = 'explore';
                finishChapter()
            }
            else {
                rhFail++;
                $('rmsg').textContent = `${rhS.hits}/8 … もういちど！`;
                if (rhFail >= 2)$('rskip').classList.remove('off');
                await wait(1400);
                if (!rhS || !$('rskip').classList.contains('clicked'))rhAttempt()
            }
        }
        $('rskip').addEventListener('click', () => {

        function placeAt(stage) {
            const tp = TP[Math.min(stage, 5)];
            P.x = tp.x - 2.5;
            P.z = tp.z + 5;
            yaw = Math.atan2(-(tp.x - P.x), -(tp.z - P.z));
            pitch = 0
        }

        function begin(cont) {
            ensureAudio();
            ambStart();
            music.set('explore');
            Q.name = $('nm').value.trim() || Q.name || 'あなた';
            if (cont) {
                const s = J('kamanteQuest', {stage: 0});
                Q.stage = Math.min(s.stage || 0, 5)
            } else Q.stage = 0;
            Q.sub = 0;
            Q.lit = 0;
            Q.got = 0;
            tries = 0;
            lanterns.forEach(L => L.lit = false);
            orbs.forEach(o => o.got = false);
            scrolls.forEach(o => o.got = false);
            placeAt(Q.stage);
            refreshWorld();
            save();
            $('title').classList.add('off');
            mode = 'explore';
            if (!cont || Q.stage === 0)toast('🕹 左下をなぞって歩こう<br>光の柱の先に、道宮先生がいるよ', 3600);
            else chapterCine(Q.stage)
        }
        $('startB').onclick = () => {
            if (!$('nm').value.trim() && !Q.name) {
                $('nm').focus();
                $('nm').style.borderColor = '#e53935';
                return
            }
            begin(false)
        };
        $('contB').onclick = () => begin(true);
        $('againB').onclick = () => {
            $('end').classList.add('off');
            Q.stage = 0;
            begin(false)
        };
        $('sndB').onclick = () => {
            ensureAudio();
            setSnd(!sndOn)
        };
        $('homeB').onclick = () => location.href = 'index.html';
        setSnd(sndOn);
        $('loreB').onclick = openBook;
        $('closeLore').onclick = closeBook;
        $('autoB').onclick = () => {
            if (mode === 'explore')setAuto(!auto)
        };
        $('setB').onclick = () => {
            if (mode === 'explore') {
                mode = 'task';
                $('set').classList.remove('off')
            }
        };
        $('closeSet').onclick = () => {
            $('set').classList.add('off');
            mode = 'explore'
        };
        document.querySelectorAll('[data-sens]').forEach(b => b.onclick = () => {
            SET.sens = +b.dataset.sens;
            applySet()
            });
        document.querySelectorAll('[data-zoom]').forEach(b => b.onclick = () => {
            SET.zoom = +b.dataset.zoom;
            applySet()
            });
        document.querySelectorAll('[data-cine]').forEach(b => b.onclick = () => {
            SET.cine = b.dataset.cine === '1';
            applySet()
            });
        document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
            SET.quality = b.dataset.q;
            applySet();
            toast('画質を かえたよ。ページをひらきなおすと はんえいされます')
            });
        applySet();
        (function boot() {
            const sv = J('kamanteQuest', null);
            if (sv && sv.name) {
                Q.name = sv.name;
                $('nm').value = sv.name
            }
            if (sv && sv.stage > 0 && sv.stage <= 5) {
                $('contB').classList.remove('off');
                $('contB').textContent = 'つづきから (第' + sv.stage + '章〜)'
            }
            if (typeof THREE === 'undefined') {
                $('title').insertAdjacentHTML('beforeend', '<div class="help" style="color:#ff8a80">3Dの読み込みに失敗しました。<br>ネットにつながっているか確認してね。</div>');
                $('startB').disabled = true;
                return
            }
            try {
                buildWorld();
                placeAt(0);
                camera.position.set(P.x, 1.65, P.z);
                camera.rotation.set(0, yaw, 0);
                refreshWorld();
                requestAnimationFrame(frame)
            }
            catch (e) {
                console.error(e);
                $('title').insertAdjacentHTML('beforeend', '<div class="help" style="color:#ff8a80">3Dが動かない端末のようです。(WebGL)</div>');
                $('startB').disabled = true
            }
            })();
    </script>
</body>
</html>
